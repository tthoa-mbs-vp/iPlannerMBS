name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    name: Web — typecheck · lint · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run ci
      # Fails on a coverage regression; thresholds live in web/vite.config.ts.
      - run: npm run test:coverage
      # Known-issues gate. Every advisory below is a transitive dep of the
      # dev/build toolchain (jsdom, eslint, vite-plugin-pwa -> workbox-build) and
      # none of them is emitted into dist/. `npm audit --omit=dev` is NOT used as
      # the gate because npm still walks those packages through vite-plugin-pwa,
      # so it reports build-only issues as if they were shipped.
      # A new advisory, or one already listed becoming unfixed upstream, fails.
      - name: Dependency audit (allowlisted dev toolchain)
        run: |
          set -e
          ALLOWED="undici brace-expansion fast-uri js-yaml nanoid postcss vitest @vitest/mocker @vitest/coverage-v8"
          NEW=$(npm audit --json | node -e '
            let d = ""; process.stdin.on("data", c => d += c).on("end", () => {
              const a = JSON.parse(d);
              const allowed = new Set(process.argv[1].split(" "));
              const bad = Object.entries(a.vulnerabilities)
                .filter(([name]) => !allowed.has(name))
                .map(([name, v]) => `${name} (${v.severity})`);
              console.log(bad.join("\n"));
            });
          ' "$ALLOWED")
          if [ -n "$NEW" ]; then
            echo "::error::Unrecognised vulnerabilities (not in the dev-toolchain baseline):"
            echo "$NEW"
            exit 1
          fi
          echo "Only known dev-toolchain advisories remain."

  # The integration tests boot a FRESH PocketBase instance — the migration chain
  # (created_* + updated_* in backend/pb_migrations) self-bootstraps the full 27-
  # collection schema, so CI needs no checked-in pb_data. The binary version must
  # match backend/Dockerfile (PB_VERSION=0.39.10).
  backend:
    name: Backend — syntax · unit · integration (fresh boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download PocketBase 0.39.10
        run: |
          set -e
          mkdir -p /tmp/pb-bin
          wget -q https://github.com/pocketbase/pocketbase/releases/download/v0.39.10/pocketbase_0.39.10_linux_amd64.zip
          unzip -o pocketbase_0.39.10_linux_amd64.zip -d /tmp/pb-bin
          chmod +x /tmp/pb-bin/pocketbase
      - name: node --check on all pb_hooks + pb_migrations
        run: |
          set -e
          find backend/pb_hooks -name '*.js' -print0 | xargs -0 -n1 node --check
          find backend/pb_migrations -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Backend unit tests (logic, no server)
        run: |
          set -e
          node backend/test/helpers_logic.test.js
          node backend/test/guards_logic.test.js
          node backend/test/guard_proxy.test.js
      - name: Integration tests against a fresh-booted instance
        env:
          PB_EXE: /tmp/pb-bin/pocketbase
        run: |
          set -e
          node backend/test/harden_integration.test.js
          node backend/test/scope_integration.test.js
          node backend/test/audit_integration.test.js
