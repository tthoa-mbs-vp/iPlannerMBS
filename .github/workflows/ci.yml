name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    name: Web — typecheck · lint · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run ci

  # The integration tests boot a FRESH PocketBase instance — the migration chain
  # (created_* + updated_* in backend/pb_migrations) self-bootstraps the full 27-
  # collection schema, so CI needs no checked-in pb_data. The binary version must
  # match backend/Dockerfile (PB_VERSION=0.39.10).
  backend:
    name: Backend — syntax · unit · integration (fresh boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download PocketBase 0.39.10
        run: |
          set -e
          mkdir -p /tmp/pb-bin
          wget -q https://github.com/pocketbase/pocketbase/releases/download/v0.39.10/pocketbase_0.39.10_linux_amd64.zip
          unzip -o pocketbase_0.39.10_linux_amd64.zip -d /tmp/pb-bin
          chmod +x /tmp/pb-bin/pocketbase
      - name: node --check on all pb_hooks + pb_migrations
        run: |
          set -e
          find backend/pb_hooks -name '*.js' -print0 | xargs -0 -n1 node --check
          find backend/pb_migrations -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Backend unit tests (logic, no server)
        run: |
          set -e
          node backend/test/helpers_logic.test.js
          node backend/test/guards_logic.test.js
          node backend/test/guard_proxy.test.js
      - name: Integration tests against a fresh-booted instance
        env:
          PB_EXE: /tmp/pb-bin/pocketbase
        run: |
          set -e
          node backend/test/harden_integration.test.js
          node backend/test/scope_integration.test.js
          node backend/test/audit_integration.test.js
